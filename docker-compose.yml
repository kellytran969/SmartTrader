services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - smarttrader-mongo:/data/db

  market-data:
    build: ./market-data
    ports:
      - "8000:8000"
    environment:
      PRICE_PROVIDER: ${PRICE_PROVIDER:-simulated}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  api:
    build: ./api
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/smarttrader
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      MARKET_DATA_URL: http://market-data:8000
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      - mongo
      - market-data

  client:
    build: ./client
    ports:
      - "8080:80"
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_MARKET_DATA_WS: ws://localhost:8000/ws/ticks
    depends_on:
      - api

volumes:
  smarttrader-mongo:
